<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="description" content="成都闲逛 - 在成都街头骑行探索的休闲游戏">
    <title>成都闲逛 - HangoutChengdu</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Microsoft YaHei', 'PingFang SC', sans-serif;
            overflow: hidden;
            background-color: #87CEEB;
        }
        
        #gameCanvas {
            display: block;
            width: 100vw;
            height: 100vh;
            touch-action: none;
        }
        
        #ui-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 100;
        }
        
        #stats-panel {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 15px;
            border-radius: 10px;
            font-size: 14px;
            min-width: 200px;
        }
        
        .stat-item {
            margin: 5px 0;
            display: flex;
            justify-content: space-between;
        }
        
        .stat-label {
            font-weight: bold;
            margin-right: 10px;
        }
        
        #location-info {
            position: absolute;
            bottom: 80px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.8);
            color: #FFD700;
            padding: 10px 20px;
            border-radius: 20px;
            font-size: 16px;
            display: none;
            animation: fadeIn 0.5s;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateX(-50%) translateY(10px); }
            to { opacity: 1; transform: translateX(-50%) translateY(0); }
        }
        
        #controls {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.5);
            color: white;
            padding: 10px 20px;
            border-radius: 10px;
            font-size: 12px;
            text-align: center;
        }
        
        #mobile-controls {
            position: absolute;
            bottom: 20px;
            width: 100%;
            display: none;
            pointer-events: auto;
        }
        
        .control-row {
            display: flex;
            justify-content: center;
            margin: 5px 0;
        }
        
        .control-btn {
            background: rgba(255, 255, 255, 0.3);
            border: 2px solid rgba(255, 255, 255, 0.5);
            border-radius: 10px;
            color: white;
            font-size: 20px;
            width: 60px;
            height: 60px;
            margin: 5px;
            display: flex;
            align-items: center;
            justify-content: center;
            user-select: none;
            touch-action: manipulation;
        }
        
        .control-btn:active {
            background: rgba(255, 255, 255, 0.5);
        }
        
        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.8);
            color: white;
            padding: 30px;
            border-radius: 15px;
            text-align: center;
            font-size: 18px;
        }
        
        .spinner {
            border: 4px solid rgba(255, 255, 255, 0.3);
            border-top: 4px solid white;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        @media (max-width: 768px) {
            #controls {
                display: none;
            }
            #mobile-controls {
                display: block;
            }
            #stats-panel {
                font-size: 12px;
                padding: 10px;
                min-width: 150px;
            }
        }
        
        /* 联机大厅样式 */
        #lobby-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 300;
        }
        
        #lobby-panel {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            border: 2px solid #0f3460;
            border-radius: 20px;
            padding: 40px;
            max-width: 500px;
            width: 90%;
            text-align: center;
            color: white;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
        }
        
        #lobby-panel h1 {
            font-size: 32px;
            margin-bottom: 10px;
            color: #FFD700;
        }
        
        #lobby-panel h2 {
            font-size: 18px;
            margin-bottom: 30px;
            color: #aaa;
            font-weight: normal;
        }
        
        .lobby-input {
            width: 100%;
            padding: 15px;
            margin: 10px 0;
            border: 2px solid #0f3460;
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.1);
            color: white;
            font-size: 16px;
            outline: none;
        }
        
        .lobby-input:focus {
            border-color: #FFD700;
        }
        
        .lobby-input::placeholder {
            color: #888;
        }
        
        .lobby-btn {
            width: 100%;
            padding: 15px;
            margin: 10px 0;
            border: none;
            border-radius: 10px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .lobby-btn-primary {
            background: linear-gradient(135deg, #FFD700 0%, #FFA500 100%);
            color: #1a1a2e;
        }
        
        .lobby-btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(255, 215, 0, 0.4);
        }
        
        .lobby-btn-secondary {
            background: rgba(255, 255, 255, 0.1);
            color: white;
            border: 2px solid #0f3460;
        }
        
        .lobby-btn-secondary:hover {
            background: rgba(255, 255, 255, 0.2);
        }
        
        .lobby-divider {
            margin: 20px 0;
            color: #666;
            font-size: 14px;
        }
        
        .lobby-info {
            margin-top: 20px;
            padding: 15px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
            font-size: 14px;
            color: #aaa;
        }
        
        /* 玩家列表样式 */
        #player-list {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 15px;
            border-radius: 10px;
            font-size: 14px;
            min-width: 150px;
            display: none;
        }
        
        #player-list h3 {
            margin-bottom: 10px;
            color: #FFD700;
        }
        
        .player-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 5px 0;
            padding: 5px;
            border-radius: 5px;
        }
        
        .player-color {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            margin-right: 8px;
        }
        
        .player-name {
            flex: 1;
        }
        
        .player-coins {
            color: #FFD700;
        }
    </style>
</head>
<body>
    <!-- 联机大厅 -->
    <div id="lobby-overlay">
        <div id="lobby-panel">
            <h1>🛺 成都闲逛</h1>
            <h2>在成都街头骑三轮车探索的休闲游戏</h2>
            
            <input type="text" class="lobby-input" id="player-name" placeholder="输入你的昵称" maxlength="10">
            
            <button class="lobby-btn lobby-btn-secondary" id="btn-single-player">
                🎮 单人模式
            </button>
            
            <div class="lobby-divider">─── 或者联机游戏 ───</div>
            
            <input type="text" class="lobby-input" id="room-id" placeholder="输入房间号 (留空创建新房间)" maxlength="20">
            
            <button class="lobby-btn lobby-btn-primary" id="btn-multiplayer">
                🌐 加入联机 (最多6人)
            </button>
            
            <div class="lobby-info">
                <div>💰 联机规则：</div>
                <div>• 访问地标获得金币奖励</div>
                <div>• 玩家碰撞双方各扣20金币</div>
                <div>• 金币归零即失败</div>
            </div>
        </div>
    </div>
    
    <div id="loading" style="display: none;">
        <div>正在加载成都街景...</div>
        <div class="spinner"></div>
    </div>
    
    <canvas id="gameCanvas"></canvas>
    
    <div id="ui-overlay">
        <div id="stats-panel">
            <div class="stat-item">
                <span class="stat-label">行驶距离:</span>
                <span id="distance">0.00 km</span>
            </div>
            <div class="stat-item">
                <span class="stat-label">速度:</span>
                <span id="speed">0 km/h</span>
            </div>
            <div class="stat-item">
                <span class="stat-label">游戏时间:</span>
                <span id="time">00:00</span>
            </div>
        </div>
        
        <!-- 玩家列表 (联机模式) -->
        <div id="player-list">
            <h3>🎮 玩家列表</h3>
            <div id="player-list-content"></div>
        </div>
        
        <div id="location-info"></div>
        
        <div id="controls">
            PC: W/↑ 前进 | S/↓ 倒车 | A/← D/→ 转向 | 空格 刹车 | R 重置 | 拖拽旋转视角
        </div>
        
        <div id="mobile-controls">
            <div class="control-row">
                <div class="control-btn" id="btn-forward">↑</div>
            </div>
            <div class="control-row">
                <div class="control-btn" id="btn-left">←</div>
                <div class="control-btn" id="btn-brake">⬛</div>
                <div class="control-btn" id="btn-right">→</div>
            </div>
            <div class="control-row">
                <div class="control-btn" id="btn-backward">↓</div>
            </div>
        </div>
    </div>
    
    <script type="module" src="main.js"></script>
</body>
</html>
