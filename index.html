<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="description" content="成都闲逛 - 在成都街头骑行探索的休闲游戏">
    <title>成都闲逛 - HangoutChengdu</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Microsoft YaHei', 'PingFang SC', sans-serif;
            overflow: hidden;
            background-color: #87CEEB;
        }
        
        #gameCanvas {
            display: block;
            width: 100vw;
            height: 100vh;
            touch-action: none;
        }
        
        #ui-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 100;
        }
        
        #stats-panel {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 15px;
            border-radius: 10px;
            font-size: 14px;
            min-width: 200px;
        }
        
        .stat-item {
            margin: 5px 0;
            display: flex;
            justify-content: space-between;
        }
        
        .stat-label {
            font-weight: bold;
            margin-right: 10px;
        }
        
        #location-info {
            position: absolute;
            bottom: 80px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.8);
            color: #FFD700;
            padding: 10px 20px;
            border-radius: 20px;
            font-size: 16px;
            display: none;
            animation: fadeIn 0.5s;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateX(-50%) translateY(10px); }
            to { opacity: 1; transform: translateX(-50%) translateY(0); }
        }
        
        #controls {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.5);
            color: white;
            padding: 10px 20px;
            border-radius: 10px;
            font-size: 12px;
            text-align: center;
        }
        
        #mobile-controls {
            position: absolute;
            bottom: 20px;
            width: 100%;
            display: none;
            pointer-events: auto;
        }
        
        .control-row {
            display: flex;
            justify-content: center;
            margin: 5px 0;
        }
        
        .control-btn {
            background: rgba(255, 255, 255, 0.3);
            border: 2px solid rgba(255, 255, 255, 0.5);
            border-radius: 10px;
            color: white;
            font-size: 20px;
            width: 60px;
            height: 60px;
            margin: 5px;
            display: flex;
            align-items: center;
            justify-content: center;
            user-select: none;
            touch-action: manipulation;
        }
        
        .control-btn:active {
            background: rgba(255, 255, 255, 0.5);
        }
        
        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.8);
            color: white;
            padding: 30px;
            border-radius: 15px;
            text-align: center;
            font-size: 18px;
        }
        
        .spinner {
            border: 4px solid rgba(255, 255, 255, 0.3);
            border-top: 4px solid white;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        @media (max-width: 768px) {
            #controls {
                display: none;
            }
            #mobile-controls {
                display: block;
            }
            #stats-panel {
                font-size: 12px;
                padding: 10px;
                min-width: 150px;
            }
        }
    </style>
</head>
<body>
    <div id="loading">
        <div>正在加载成都街景...</div>
        <div class="spinner"></div>
    </div>
    
    <canvas id="gameCanvas"></canvas>
    
    <div id="ui-overlay">
        <div id="stats-panel">
            <div class="stat-item">
                <span class="stat-label">行驶距离:</span>
                <span id="distance">0.00 km</span>
            </div>
            <div class="stat-item">
                <span class="stat-label">速度:</span>
                <span id="speed">0 km/h</span>
            </div>
            <div class="stat-item">
                <span class="stat-label">游戏时间:</span>
                <span id="time">00:00</span>
            </div>
        </div>
        
        <div id="location-info"></div>
        
        <div id="controls">
            PC: W/↑ 前进 | S/↓ 倒车 | A/← D/→ 转向 | 空格 刹车 | R 重置 | 拖拽旋转视角
        </div>
        
        <div id="mobile-controls">
            <div class="control-row">
                <div class="control-btn" id="btn-forward">↑</div>
            </div>
            <div class="control-row">
                <div class="control-btn" id="btn-left">←</div>
                <div class="control-btn" id="btn-brake">⬛</div>
                <div class="control-btn" id="btn-right">→</div>
            </div>
            <div class="control-row">
                <div class="control-btn" id="btn-backward">↓</div>
            </div>
        </div>
    </div>
    
    <script type="module" src="main.js"></script>
</body>
</html>
